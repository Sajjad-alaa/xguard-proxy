[package]
name = "xguard-proxy"
version = "2.2.0"
edition = "2024"
license = "Apache-2.0"
homepage = "https://github.com/Sajjad-alaa/xguard-proxy"
repository = "https://github.com/Sajjad-alaa/xguard-proxy"

[dependencies]
xguard_certs = { git = "https://github.com/Sajjad-alaa/xguard-core.git", rev = "3afe0f2c6acf85733bbf948a832682151b19c196" }
xguard_grpc_tls = { git = "https://github.com/Sajjad-alaa/xguard-core.git", rev = "3afe0f2c6acf85733bbf948a832682151b19c196" }
xguard_version = { git = "https://github.com/Sajjad-alaa/xguard-core.git", rev = "3afe0f2c6acf85733bbf948a832682151b19c196" }
rustls-webpki = { version = "0.103", features = ["aws-lc-rs", "std"] }
rustls-pki-types = "1"
# base `axum` deps
axum = { version = "0.8", features = ["ws"] }
axum-client-ip = {version = "1.3", default-features = false, features = ["forwarded-header"] }
axum-extra = { version = "0.12", features = [
    "cookie",
    "cookie-private",
    "typed-header",
] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
# match axum-extra -> cookies
cookie = "0.18.1"
time = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tower-http = { version = "0.7", features = ["fs", "trace", "timeout"] }
# logging/tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log = { version = "0.4", features = ["serde"] }
# data de/serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
toml = { version = "1.0", default-features = false, features = [
    "parse",
    "serde",
] }
# gRPC
prost = "0.14"
tonic = { version = "0.14", features = ["gzip", "tls-native-roots"] }
tonic-prost = "0.14"
# error handling
thiserror = "2.0"
anyhow = "1.0"
# CLI
clap = { version = "4.6", features = ["derive", "env", "cargo"] }
# other utils
dotenvy = "0.15"
url = { version = "2.5", features = ["serde"] }
tower_governor = "0.8"
# UI embedding
rust-embed = { version = "8.5", features = ["include-exclude"] }
mime_guess = "2.0"
base64 = "0.23"
tower = "0.5"
futures-util = "0.3"
ammonia = "4.2.4"
chrono = "0.4"
rustls = { version = "0.23", default-features = false, features = [
    "aws-lc-rs",
] }
instant-acme = { version = "0.8", features = ["hyper-rustls", "aws-lc-rs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net"] }

[build-dependencies]
tonic-prost-build = "0.14"
vergen-git2 = { version = "10.0", features = ["build"] }

[lints.clippy]
uninlined_format_args = "deny"
manual_let_else = "warn"
redundant_closure = "warn"

[profile.release]
lto = "thin"
strip = "symbols"
